<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رضا الفحام التدريبية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Tajawal & Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .font-display { font-family: 'Cairo', sans-serif; }
        .font-body { font-family: 'Tajawal', sans-serif; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 14s linear infinite; }
        @keyframes float-a { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
        @keyframes float-b { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(12px) rotate(-5deg); } }
        .animate-float-a { animation: float-a 6.5s ease-in-out infinite; }
        .animate-float-b { animation: float-b 7.5s ease-in-out infinite; }
        @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-rise-in { animation: rise-in 0.7s ease-out both; }
    </style>
</head>
<body class="bg-white font-body">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Settings, UserRound, GraduationCap, MessageCircle, Instagram, Facebook, 
            Youtube, Twitter, Linkedin, Phone, Coins, Calculator, Receipt, ShieldCheck, 
            Home, BookOpenCheck, UserPlus, KeyRound, Eye, EyeOff, MapPin, Briefcase, 
            CheckCircle2, AlertCircle, LogIn, Send, Users, UserCheck, ListTree, 
            NotebookPen, ClipboardCheck, Link2, LogOut, LayoutDashboard, Pencil, Lock, 
            Unlock, Trash2, X, XCircle, RefreshCw, CalendarClock, ChevronDown, 
            UploadCloud, Download, Plus, ArrowRight, Bell, Music, AtSign, MessageSquare, 
            Scale, TrendingUp, Landmark, PartyPopper 
        } = LucideReact;

        const VIEWS = {
            HOME: "home",
            GUEST_LOGIN: "guest-login",
            TRAINEE_LOGIN: "trainee-login",
            MESSAGES: "messages",
            ADMIN: "admin",
            TRAINEE_JOURNAL: "trainee-journal",
            TRAINEE_LEDGER: "trainee-ledger",
            TRAINEE_TRIAL_BALANCE: "trainee-trial-balance",
            TRAINEE_INCOME_STATEMENT: "trainee-income-statement",
            TRAINEE_BALANCE_SHEET: "trainee-balance-sheet"
        };

        const PLATFORM_OPTIONS = [
            { key: "instagram", label: "إنستغرام", icon: Instagram },
            { key: "tiktok", label: "تيك توك", icon: Music },
            { key: "whatsapp", label: "واتساب", icon: MessageCircle },
            { key: "threads", label: "ثريدز", icon: AtSign },
            { key: "facebook", label: "فيسبوك", icon: Facebook },
            { key: "youtube", label: "يوتيوب", icon: Youtube },
            { key: "x", label: "إكس (X)", icon: Twitter },
            { key: "linkedin", label: "لينكد إن", icon: Linkedin },
            { key: "whatsapp-business", label: "واتساب أعمال", icon: MessageCircle },
            { key: "messenger", label: "ماسنجر", icon: MessageSquare }
        ];

        function getPlatformInfo(key) {
            return PLATFORM_OPTIONS.find(p => p.key === key) || { label: key, icon: MessageCircle };
        }

        function createEmptyJournalRow() {
            return {
                id: `row-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                entryNumber: "",
                entryDate: "",
                account: "",
                debit: "",
                credit: "",
                notes: ""
            };
        }

        function createEmptyLedgerLine() {
            return {
                id: `led-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                value: "",
                account: "",
                entryNumber: "",
                date: ""
            };
        }

        function createEmptyLedgerPage() {
            return {
                id: `page-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                accountLabel: "",
                debitLines: [createEmptyLedgerLine()],
                creditLines: [createEmptyLedgerLine()]
            };
        }

        function computePageTotals(page) {
            const debitTotal = (page.debitLines || []).reduce((sum, l) => sum + (parseFloat(l.value) || 0), 0);
            const creditTotal = (page.creditLines || []).reduce((sum, l) => sum + (parseFloat(l.value) || 0), 0);
            const grandTotal = Math.max(debitTotal, creditTotal);
            const balance = Math.abs(debitTotal - creditTotal);
            const debitIsLarger = debitTotal >= creditTotal;
            return { debitTotal, creditTotal, grandTotal, balance, debitIsLarger };
        }

        const INITIAL_SOCIAL_LINKS = [
            { id: 1, platformKey: "whatsapp", url: "https://wa.me/9647701234567", isHidden: false },
            { id: 2, platformKey: "instagram", url: "https://instagram.com/reda.alfahham", isHidden: false },
            { id: 3, platformKey: "facebook", url: "", isHidden: false }
        ];

        function App() {
            const [currentView, setCurrentView] = useState(VIEWS.HOME);
            const [socialLinks, setSocialLinks] = useState(INITIAL_SOCIAL_LINKS);
            const [journalEntries, setJournalEntries] = useState([createEmptyJournalRow()]);
            const [ledgerPages, setLedgerPages] = useState([createEmptyLedgerPage()]);
            const [netIncomeResult, setNetIncomeResult] = useState(0);

            return (
                <div dir="rtl" className="min-h-screen w-full bg-white font-body">
                    {currentView === VIEWS.HOME && <HomeScreen setCurrentView={setCurrentView} socialLinks={socialLinks} />}
                    {currentView === VIEWS.GUEST_LOGIN && <GuestLoginScreen setCurrentView={setCurrentView} />}
                    {currentView === VIEWS.TRAINEE_LOGIN && <TraineeLoginScreen setCurrentView={setCurrentView} />}
                    {currentView === VIEWS.MESSAGES && <MessagesScreen setCurrentView={setCurrentView} />}
                    {currentView === VIEWS.TRAINEE_JOURNAL && (
                        <TraineeJournalScreen setCurrentView={setCurrentView} journalEntries={journalEntries} setJournalEntries={setJournalEntries} />
                    )}
                    {currentView === VIEWS.TRAINEE_LEDGER && (
                        <TraineeLedgerScreen setCurrentView={setCurrentView} journalEntries={journalEntries} ledgerPages={ledgerPages} setLedgerPages={setLedgerPages} />
                    )}
                    {currentView === VIEWS.TRAINEE_TRIAL_BALANCE && (
                        <TraineeTrialBalanceScreen setCurrentView={setCurrentView} ledgerPages={ledgerPages} />
                    )}
                    {currentView === VIEWS.TRAINEE_INCOME_STATEMENT && (
                        <TraineeIncomeStatementScreen setCurrentView={setCurrentView} ledgerPages={ledgerPages} setNetIncomeResult={setNetIncomeResult} />
                    )}
                    {currentView === VIEWS.TRAINEE_BALANCE_SHEET && (
                        <TraineeBalanceSheetScreen setCurrentView={setCurrentView} ledgerPages={ledgerPages} netIncomeResult={netIncomeResult} />
                    )}
                    {currentView === VIEWS.ADMIN && (
                        <AdminScreen setCurrentView={setCurrentView} socialLinks={socialLinks} setSocialLinks={setSocialLinks} />
                    )}
                </div>
            );
        }

        function HomeScreen({ setCurrentView, socialLinks }) {
            const goTo = (view) => (e) => { e.preventDefault(); setCurrentView(view); };
            const actionCards = [
                { key: VIEWS.GUEST_LOGIN, icon: UserRound, title: "الدخول كضيف", subtitle: "جرّب أمثلة وتمارين مختارة دون تسجيل مسبق" },
                { key: VIEWS.TRAINEE_LOGIN, icon: GraduationCap, title: "الدخول كمتدرب", subtitle: "تابع دوراتك وتمارينك ونتائجك التفصيلية" },
                { key: VIEWS.MESSAGES, icon: MessageCircle, title: "مراسلات", subtitle: "تواصل مباشر مع المدرب رضا الفحام" }
            ];
            const visibleSocialLinks = (socialLinks || []).filter(link => link.url.trim() && !link.isHidden);

            return (
                <div className="relative min-h-screen overflow-hidden bg-gradient-to-b from-white via-sky-50 to-sky-100">
                    <div className="pointer-events-none absolute inset-0 opacity-[0.35]" style={{ backgroundImage: "repeating-linear-gradient(to bottom, rgba(2,132,199,0.06) 0px, rgba(2,132,199,0.06) 1px, transparent 1px, transparent 40px)" }} />
                    <button type="button" onClick={goTo(VIEWS.ADMIN)} aria-label="إعدادات الإدارة" className="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex h-10 w-10 items-center justify-center rounded-full bg-white text-sky-700 shadow-md ring-1 ring-sky-100 transition-all hover:-translate-y-0.5 hover:shadow-lg hover:text-sky-900 active:translate-y-0 active:shadow-sm">
                        <Settings className="h-5 w-5" strokeWidth={1.8} />
                    </button>
                    <div className="relative z-10 mx-auto flex min-h-screen max-w-5xl flex-col items-center px-6 pb-16 pt-16 sm:pt-20">
                        <div className="relative mx-auto mb-6 h-24 w-24 animate-rise-in">
                            <div className="absolute inset-0 rounded-full border-2 border-dashed border-sky-300 animate-spin-slow" />
                            <div className="absolute inset-2 rounded-full border border-sky-400/50" />
                            <div className="absolute inset-0 flex items-center justify-center rounded-full bg-white/60 shadow-inner">
                                <ShieldCheck className="h-9 w-9 text-sky-600" strokeWidth={1.7} />
                            </div>
                        </div>
                        <span className="animate-rise-in mb-4 inline-flex items-center gap-1.5 rounded-full bg-sky-100 px-4 py-1.5 text-xs font-medium text-sky-700">
                            <BookOpenCheck className="h-3.5 w-3.5" strokeWidth={2} /> تدريب تطبيقي معتمد في المحاسبة
                        </span>
                        <h1 className="animate-rise-in font-display text-center text-3xl font-extrabold leading-tight text-sky-900 sm:text-4xl md:text-5xl">
                            منصة <span className="bg-gradient-to-l from-sky-600 to-sky-800 bg-clip-text text-transparent">رضا الفحام</span> التدريبية
                        </h1>
                        <p className="animate-rise-in mt-5 max-w-2xl text-center text-sm leading-7 text-sky-900/70 sm:text-base">
                            بيئة تدريب عملي تحاكي واقع العمل المحاسبي خطوة بخطوة — من كتابة القيد اليومي وترحيله إلى دفتر الأستاذ، مرورًا بميزان المراجعة، وصولًا إلى القوائم المالية الختامية.
                        </p>
                        <div className="animate-rise-in mt-12 grid w-full grid-cols-1 gap-5 sm:grid-cols-3">
                            {actionCards.map(({ key, icon: Icon, title, subtitle }) => (
                                <button key={key} type="button" onClick={goTo(key)} className="group flex flex-col items-center rounded-3xl bg-white px-6 py-8 text-center shadow-md ring-1 ring-sky-100 transition-all duration-200 hover:-translate-y-1.5 hover:shadow-2xl hover:ring-sky-200 active:translate-y-0 active:shadow-md">
                                    <span className="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-b from-sky-400 to-sky-600 text-white shadow-[0_8px_18px_-6px_rgba(2,132,199,0.55)] transition-transform duration-200 group-hover:scale-105 group-active:scale-95">
                                        <Icon className="h-8 w-8" strokeWidth={1.8} />
                                    </span>
                                    <span className="font-display text-lg font-bold text-sky-900">{title}</span>
                                    <span className="mt-1.5 text-xs leading-6 text-sky-900/55">{subtitle}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function GuestLoginScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">شاشة تسجيل الضيوف</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function TraineeLoginScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">شاشة تسجيل المتدربين</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function MessagesScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">شاشة المراسلات</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function AdminScreen({ setCurrentView, socialLinks, setSocialLinks }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">لوحة تحكم الإدارة</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function TraineeJournalScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">دفتر اليومية</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function TraineeLedgerScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">دفتر الأستاذ</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function TraineeTrialBalanceScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">ميزان المراجعة</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function TraineeIncomeStatementScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">قائمة الدخل</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        function TraineeBalanceSheetScreen({ setCurrentView }) {
            return (
                <div className="flex min-h-screen flex-col items-center justify-center bg-gradient-to-b from-white via-sky-50 to-sky-100 px-6 text-center">
                    <h2 className="font-display text-2xl font-bold text-sky-900">قائمة المركز المالي</h2>
                    <button type="button" onClick={(e) => { e.preventDefault(); setCurrentView(VIEWS.HOME); }} className="mt-6 rounded-full bg-white px-5 py-2.5 text-sm font-medium text-sky-700 shadow-md ring-1 ring-sky-100">
                        العودة للرئيسية
                    </button>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
